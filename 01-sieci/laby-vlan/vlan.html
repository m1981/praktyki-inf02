<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorium VLAN – po co nam VLAN-y?</title>
<style>
  :root{
    --bg:#f7f6f2; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1da;
    --floor:#fbfaf6; --sw:#3b3a37; --port:#c9c7bf; --cable:#b9b7af; --bad:#c0392b; --good:#1e8449; --btn:#b3b0a5; --accent:#c98a00; --accent-bg:#fdf3d7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1a1a19; --panel:#242422; --ink:#ecebe6; --muted:#a3a19a; --line:#3a3936;
      --floor:#202020; --sw:#d6d4cc; --port:#5a5955; --cable:#5f5e59; --bad:#ff7b6b; --good:#5fd38d; --btn:#66645e; --accent:#f2b632; --accent-bg:#3a3118;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:24px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .era{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
  .knob{width:46px;height:26px;border-radius:999px;background:var(--port);position:relative;transition:background .2s}
  .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .era.on .knob{background:var(--good)} .era.on .knob::after{left:23px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
  .head h2{margin:0;font-size:20px}
  .problem{color:var(--muted);margin:4px 0 0;max-width:640px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
  .seg button{font:inherit;font-size:14px;padding:8px 14px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
  .seg button.on.before{background:var(--bad);color:#fff}
  .seg button.on.after{background:var(--good);color:#fff}
  .stage{margin-top:14px;border-radius:10px;background:var(--bg);padding:8px}
  .stage svg{width:100%;height:auto;display:block}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .actions button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
  .actions button:hover:not(:disabled){border-color:var(--ink)}
  .actions button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .actions button:disabled{opacity:.4;cursor:not-allowed}
  .actions{align-items:center}
  .stepinfo{font-size:14px;padding:0 6px;font-variant-numeric:tabular-nums}
  .actions .hint{font-size:12px;color:var(--muted);margin-left:auto}
  .metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .metric{flex:1 1 170px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .metric .v{font-size:22px;font-weight:700}
  .metric .k{font-size:12px;color:var(--muted)}
  .metric.bad .v{color:var(--bad)} .metric.good .v{color:var(--good)}
  .explain{margin-top:12px;padding:10px 14px;border-left:4px solid var(--bad);background:var(--bg);border-radius:0 8px 8px 0}
  .explain.after{border-left-color:var(--good)}
  .log{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
  .log li{padding:4px 0;border-bottom:1px dashed var(--line);animation:fade .3s}
  .log li .t{display:inline-block;min-width:74px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .log code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* everything clickable looks raised; results look flat */
  .tab,.actions button,.seg{border-color:var(--btn);box-shadow:0 2px 0 var(--btn)}
  .tab,.actions button{transition:transform .05s, box-shadow .05s}
  .tab:active,.actions button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
  .tab:hover,.seg button:hover{filter:brightness(.96)}
  .actions button:disabled{box-shadow:none;border-style:dashed;opacity:.45}
  button:focus-visible,.era:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .metrics-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 0}
  .metric{border:0;border-left:3px solid var(--line);border-radius:0;padding:2px 12px}
  .guide{display:flex;gap:10px;align-items:baseline;margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--accent-bg);border:1px solid var(--accent)}
  .guide .gs{font-size:12px;font-weight:700;white-space:nowrap;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
  .guide .gl{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  @media (max-width:700px){.guide{flex-wrap:wrap}.guide .gl{margin-left:0}}
  .next{position:relative;border-color:var(--accent)!important;animation:nextp 1.2s ease-in-out infinite}
  @keyframes nextp{0%,100%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent)}}
  .pingS{fill:none;stroke:var(--accent);stroke-width:3;animation:pingS .9s ease-out 2 forwards}
  @keyframes pingS{0%{r:6;opacity:1}100%{r:22;opacity:0}}
  @media (prefers-reduced-motion:reduce){.next{animation:none;outline:3px solid var(--accent);outline-offset:2px}.pingS{animation:none;r:11}}
  .story{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(250px,1fr);gap:10px;align-items:stretch}
  @media (max-width:760px){.story{grid-template-columns:1fr}}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:250px}
  .dlg .who{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted)}
  .dlg .who b{color:var(--ink);display:block;font-size:14px}
  .dlg .av{width:46px;height:46px;border-radius:50%;background:var(--accent-bg);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0}
  .dlg .say{font-size:20px;line-height:1.35;font-weight:600;flex:1;animation:fade .3s}
  .dlg .dots{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .dlg .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dlg .dots i.on{background:var(--ink)}
  .dlg .dots span{margin-left:auto;font-variant-numeric:tabular-nums}
  .dlg .actions{margin-top:0}
  .dlg .actions button.primary{flex:1}
  .dlg .you{align-self:flex-end;font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px 10px 2px 10px;padding:5px 10px;animation:fade .3s}
  .dlg .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:-6px}
  .dlg .actions button.primary{text-align:left;line-height:1.3}
  .dlg{gap:10px}
  .dlg .keys{font-size:11px;color:var(--muted)}
  .hl{fill:none;stroke:var(--accent);stroke-width:3;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

  /* svg */
  .ink{fill:var(--ink)} .mut{fill:var(--muted)}
  .stk{stroke:var(--ink);fill:none}
  .lbl{fill:var(--ink);font-size:12px}
  .lbls{fill:var(--muted);font-size:11px}
  .ttl{fill:var(--ink);font-size:13px;font-weight:700}
  .floor{fill:var(--floor);stroke:var(--line);stroke-width:1.5}
  .swb{fill:var(--sw)}
  .cab{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .gray{stroke:var(--cable)}
  .ping{fill:none;stroke-width:3;animation:ping 1.1s ease-out 3}
  @keyframes ping{0%{r:18;opacity:1}100%{r:40;opacity:0}}
  .wave{animation:wave 1.1s ease-out 3}
  @keyframes wave{0%{stroke-opacity:1}100%{stroke-opacity:.15}}
  .appear{animation:fade .4s}
  .blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .bad-txt{fill:var(--bad);font-weight:700;font-size:12px}
  .good-txt{fill:var(--good);font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Laboratorium VLAN: po co nam VLAN-y?</h1>
  <p class="lead">Cztery kłopoty z sieci „sprzed VLAN-ów”. Przy każdym przełącz na „Z VLAN-ami” i zobacz, jak zmienia się ten sam scenariusz.</p>

  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="era" id="era" role="switch" tabindex="0" aria-checked="false"><span class="knob"></span><span id="eraTxt">Era VLAN-ów: wyłączona</span></div>
  </div>

  <div class="card">
    <div class="head">
      <div>
        <h2 id="title"></h2>
        <p class="problem" id="problem"></p>
      </div>
      <div class="seg" id="seg">
        <button class="before" data-m="0">Przed VLAN-ami</button>
        <button class="after" data-m="1">Z VLAN-ami</button>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="legend" id="legend"></div>
    <div class="guide" id="guide"></div>
    <div class="actions" id="actions"></div>
    <ul class="log" id="log"></ul>
    <div class="metrics-h">Wynik (tylko do czytania)</div>
    <div class="metrics" id="metrics"></div>
    <div class="explain" id="explain"></div>
  </div>
</div>

<script>
(function(){
  const D = {
    it:{c:'#2f6fb3', n:'IT', vlan:10, net:'192.168.10.0/24'},
    ks:{c:'#d9772b', n:'Księgowość', vlan:20, net:'192.168.20.0/24'},
    kd:{c:'#8e44ad', n:'Kadry', vlan:30, net:'192.168.30.0/24'},
    gs:{c:'#2e9d5b', n:'Goście', vlan:40, net:'192.168.40.0/24'}
  };
  const st = { tab:0, mode:[0,0,0,0],
    s2:{ step:0, timer:null },
    s3:{ it:7, ks:5, kd:4, gs:6 }, s3step:[0,0],
    s4:{ bcast:0, intruder:false } };

  /* ---------- drawing helpers ---------- */
  function pc(x, y, col, label, extra){
    return `<g ${extra||''}><rect x="${x-16}" y="${y-13}" width="32" height="21" rx="3" fill="${col}"/>
      <rect x="${x-12}" y="${y-9}" width="24" height="13" rx="1" fill="rgba(255,255,255,.28)"/>
      <path d="M${x} ${y+8}v5M${x-7} ${y+13}h14" class="stk" stroke-width="2"/>
      ${label ? `<text x="${x}" y="${y+28}" class="lbl" text-anchor="middle">${label}</text>` : ''}</g>`;
  }
  function server(x, y, col, label){
    return `<g><rect x="${x-13}" y="${y-18}" width="26" height="34" rx="3" fill="${col}"/>
      <path d="M${x-8} ${y-9}h16M${x-8} ${y-1}h16M${x-8} ${y+7}h16" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
      ${label ? `<text x="${x}" y="${y+30}" class="lbl" text-anchor="middle">${label}</text>` : ''}</g>`;
  }
  // switch: ports = array of colors (null = empty), cols per row
  function sw(x, y, ports, cols, label, opts){
    opts = opts || {};
    const pw = opts.pw || 9, ph = opts.ph || 7, gap = opts.gap || 4;
    const rows = Math.ceil(ports.length / cols);
    const w = cols * (pw + gap) - gap + 16, h = rows * (ph + gap) - gap + 14;
    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" class="swb"/>`;
    ports.forEach((c, i) => {
      const px = x + 8 + (i % cols) * (pw + gap), py = y + 7 + Math.floor(i / cols) * (ph + gap);
      s += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="1.5" fill="${c || 'var(--port)'}"/>`;
    });
    if (label) s += `<text x="${x + (opts.labelRight ? w + 8 : w / 2)}" y="${opts.labelRight ? y + h / 2 + 4 : y - 6}" class="lbl" text-anchor="${opts.labelRight ? 'start' : 'middle'}">${label}</text>`;
    return { svg: s, w, h, port: i => ({ x: x + 8 + (i % cols) * (pw + gap) + pw / 2, y: y + 7 + Math.floor(i / cols) * (ph + gap) + ph / 2 }) };
  }
  function person(x, y, label, col){
    return `<g class="appear"><circle cx="${x}" cy="${y-16}" r="7" fill="${col||'var(--ink)'}"/>
      <path d="M${x-10} ${y+8}q10-22 20 0z" fill="${col||'var(--ink)'}"/>
      <text x="${x}" y="${y+22}" class="lbl" text-anchor="middle">${label}</text></g>`;
  }
  const svgWrap = (w, h, inner) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
  const metric = (k, v, cls) => `<div class="metric ${cls||''}"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  const legendDepts = keys => keys.map(k => `<span><i style="background:${D[k].c}"></i>${D[k].n}${st.mode[st.tab] ? ` = VLAN ${D[k].vlan}` : ''}</span>`).join('');

  /* ---------- 1: department on two floors ---------- */
  const S1PCS = [
    {f:0,x:400,d:'it'},{f:0,x:480,d:'it'},{f:0,x:620,d:'ks'},{f:0,x:700,d:'ks'},
    {f:1,x:400,d:'it'},{f:1,x:480,d:'it'},{f:1,x:620,d:'ks'},
    {f:2,x:400,d:'it'},{f:2,x:620,d:'ks'},{f:2,x:700,d:'ks'}];
  const FY = [20, 140, 260], FN = ['Piętro 3', 'Piętro 2', 'Piętro 1'];

  function s1(mode){
    let g = '';
    FY.forEach((y, i) => { g += `<rect x="60" y="${y}" width="740" height="120" class="floor"/><text x="${mode ? 250 : 260}" y="${y+18}" class="ttl">${FN[i]}</text>`; });
    g += `<rect x="98" y="20" width="40" height="360" fill="none" stroke="var(--line)" stroke-dasharray="4 3"/>`;
    g += `<text x="0" y="0" class="lbls" transform="translate(92 300) rotate(-90)">pion kablowy</text>`;
    let cables = '', devices = '';
    if (!mode){
      g += `<rect x="150" y="270" width="96" height="104" rx="4" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="198" y="388" class="lbls" text-anchor="middle">szafa</text>`;
      const pIT = Array(8).fill(null), pKS = Array(8).fill(null);
      let iIT = 0, iKS = 0;
      S1PCS.forEach((p, k) => {
        const y0 = FY[p.f], py = y0 + 62, tray = y0 + 112 - (k % 4) * 3, rx = 103 + k * 3;
        const isIT = p.d === 'it', idx = isIT ? iIT++ : iKS++;
        (isIT ? pIT : pKS)[idx] = D[p.d].c;
        const sy = (isIT ? 287 : 334) + (idx % 2) * 11 - 4;
        cables += `<path class="cab" stroke="${D[p.d].c}" d="M${p.x} ${py+13}V${tray}H${rx}V${sy}H162"/>`;
        devices += pc(p.x, py, D[p.d].c);
      });
      g += cables;
      g += sw(162, 278, pIT, 4, '').svg + `<text x="238" y="292" class="lbls">sw IT</text>`;
      g += sw(162, 325, pKS, 4, '').svg + `<text x="238" y="339" class="lbls">sw księg.</text>`;
      g += `<text x="118" y="14" class="bad-txt" text-anchor="middle">7 kabli w pionie!</text>`;
      g += devices;
    } else {
      FY.forEach((y0, f) => {
        const here = S1PCS.filter(p => p.f === f);
        const ports = Array(8).fill(null);
        here.forEach((p, k) => {
          ports[k] = D[p.d].c;
          const py = y0 + 62, tray = y0 + 112 - k * 3;
          cables += `<path class="cab" stroke="${D[p.d].c}" d="M${p.x} ${py+13}V${tray}H222V${y0+66 + (k%2)*6}"/>`;
          devices += pc(p.x, py, D[p.d].c);
        });
        g += sw(162, y0 + 45, ports, 4, '').svg;
        g += `<text x="196" y="${y0+40}" class="lbls" text-anchor="middle">${f === 2 ? 'switch (rdzeń)' : 'switch piętra'}</text>`;
      });
      // trunks
      const trunk = (yA, yB) => `<path d="M162 ${yA}H118V${yB}H162" fill="none" stroke="${D.it.c}" stroke-width="6"/>
        <path d="M162 ${yA}H118V${yB}H162" fill="none" stroke="${D.ks.c}" stroke-width="6" stroke-dasharray="9 9"/>`;
      g = g + trunk(FY[0] + 62, FY[1] + 62) + trunk(FY[1] + 62, FY[2] + 62);
      g += `<text x="118" y="14" class="good-txt" text-anchor="middle">2 trunki w pionie</text>`;
      g += cables + devices;
    }
    return svgWrap(820, 400, g);
  }

  /* ---------- 2: person changes department ---------- */
  const S2PCS = [
    {n:'Bartek', x:110, y:120, d:'it'}, {n:'Celina', x:230, y:120, d:'it'}, {n:'Anna', x:350, y:120, d:'it', anna:true},
    {n:'Dorota', x:170, y:250, d:'ks'}, {n:'Ewa', x:290, y:250, d:'ks'}];
  const S2STEPS = [
    [ {t:'0 min',  h:'📞 Zgłoszenie: od jutra Anna pracuje w księgowości, przy tym samym biurku.'},
      {t:'+20 min', h:'🚶 Technik szuka klucza i idzie do szafy (zamknięte pomieszczenie, inne piętro?).'},
      {t:'+10 min', h:'🔍 Szuka, który z setek kabli w szafie to kabel Anny.'},
      {t:'+5 min',  h:'🔌 Odpina patchcord Anny ze switcha IT. Anna jest bez sieci.'},
      {t:'+5 min',  h:'🔌 Wpina go do switcha księgowości. Na szczęście jest wolny port, a jeśli nie, trzeba dokupić switch.'},
      {t:'+15 min', h:'⌨ Zmiana adresu IP Anny na adres z podsieci księgowości. Gotowe, razem około godziny.'} ],
    [ {t:'0 min',  h:'📞 Zgłoszenie: od jutra Anna pracuje w księgowości, przy tym samym biurku.'},
      {t:'+1 min', h:'💻 Admin łączy się zdalnie ze switchem, nie wstając zza biurka.'},
      {t:'+1 min', h:'⌨ Wpisuje: <code>interface Gi0/3</code> → <code>switchport access vlan 20</code>'},
      {t:'+1 min', h:'🔄 Komputer Anny dostaje z DHCP adres z podsieci księgowości. Gotowe, razem około 3 minut. Żaden kabel nie został ruszony.'} ]
  ];

  // Anna's cable is drawn once in its PREVIOUS state, then animated to the new one (animS2),
  // so it never disappears: the plug is pulled out, hangs loose, and flies over to the new port.
  const cordPath = (a, b) => `M${a.x} ${a.y+6}C${a.x} ${a.y+50} ${b.x} ${b.y-40} ${b.x} ${b.y}`;
  const TECH_HIDDEN = { x: 790, y: 330, o: 0 };

  function s2target(mode, step, panel, swA, swB){
    const a = panel.port(2);
    if (!mode){
      const itP = swA.port(2), ksP = swB.port(2), loose = { x: 705, y: 228 };
      const at = step < 4 ? 'it' : step === 4 ? 'loose' : 'ks';
      const end = at === 'it' ? itP : at === 'loose' ? loose : ksP;
      const tech = step < 2 || step >= 6 ? TECH_HIDDEN
        : step === 2 ? { x: 760, y: 300, o: 1 }
        : step === 3 ? { x: 740, y: 138, o: 1 }
        : step === 4 ? { x: loose.x + 62, y: loose.y + 4, o: 1 }
        : { x: ksP.x + 60, y: ksP.y + 52, o: 1 };
      return { a, end, at, tech,
        cordCol: at === 'it' ? D.it.c : at === 'loose' ? '#9a988f' : D.ks.c,
        pcCol: step < 4 ? D.it.c : step < 6 ? '#b9b7af' : D.ks.c };
    }
    const vp = swA.port(2);
    return { a, end: vp, at: 'v', tech: TECH_HIDDEN,
      cordCol: step >= 3 ? D.ks.c : D.it.c, vCol: step >= 3 ? D.ks.c : D.it.c,
      pcCol: step >= 4 ? D.ks.c : D.it.c };
  }

  function s2(mode){
    const step = st.s2.step, steps = S2STEPS[mode], done = step >= steps.length;
    let g = `<rect x="20" y="40" width="410" height="300" class="floor"/><text x="34" y="62" class="ttl">Biuro, piętro 2</text>
      <rect x="470" y="40" width="330" height="300" class="floor"/><text x="484" y="62" class="ttl">Szafa sieciowa</text>`;

    g += `<rect id="annaPlug" x="${P.end.x-4}" y="${P.end.y-2}" width="8" height="11" rx="2" fill="${P.cordCol}" opacity="${P.at === 'loose' ? 1 : 0}" style="transition:fill .8s, opacity .3s"/>`;

  function animS2(){
    const P = st.s2.prev, T = st.s2.target;
    st.s2.prev = T;
    if (!P || !T) return;
    cancelAnimationFrame(st.s2.raf);
    const $q = sel => document.querySelector('#stage ' + sel);
    const cord = $q('#annaCord'), plug = $q('#annaPlug'), pcG = $q('#annaPC'), tech = $q('#tech');
    if (!cord) return;
    const pcRect = pcG && pcG.querySelector('rect');
    // colour changes: CSS transitions (element was drawn with the old colour)
    requestAnimationFrame(() => {
      cord.setAttribute('stroke', T.cordCol);
      plug.setAttribute('fill', T.cordCol);
      if (pcRect){ pcRect.style.transition = 'fill .8s'; pcRect.setAttribute('fill', T.pcCol); }
      tech.setAttribute('opacity', T.tech.o);
      const vp = $q('#annaPortV');
      if (vp){ vp.style.transition = 'fill .6s'; vp.setAttribute('fill', T.vCol); }
    });
    const moves = P.end.x !== T.end.x || P.end.y !== T.end.y;
    const techMoves = P.tech.x !== T.tech.x || P.tech.y !== T.tech.y;
    if (!moves && !techMoves) return;
    // plug leaves the old port: the port goes dark right away
    const pIT = $q('#annaPortIT'), pKS = $q('#annaPortKS');
    if (moves && P.at === 'it' && pIT) pIT.setAttribute('fill', 'var(--port)');
    if (moves && P.at === 'ks' && pKS) pKS.setAttribute('fill', 'var(--port)');
    if (moves) plug.setAttribute('opacity', 1);
    const D_MS = 1100, t0 = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const frame = now => {
      const t = Math.min(1, (now - t0) / D_MS), e = ease(t);
      if (moves){
        const lift = 38 * Math.sin(Math.PI * e);
        const x = P.end.x + (T.end.x - P.end.x) * e, y = P.end.y + (T.end.y - P.end.y) * e - lift;
        cord.setAttribute('d', cordPath(T.a, { x, y }));
        plug.setAttribute('x', x - 4); plug.setAttribute('y', y - 2);
      }
      if (techMoves){
        const tx = P.tech.x + (T.tech.x - P.tech.x) * e, ty = P.tech.y + (T.tech.y - P.tech.y) * e;
        tech.setAttribute('transform', `translate(${tx} ${ty})`);
      }
      if (t < 1) st.s2.raf = requestAnimationFrame(frame);
      else {
        // plug arrives: the new port lights up, the plug "disappears" into the port
        if (T.at === 'ks' && pKS) pKS.setAttribute('fill', D.ks.c);
        if (T.at === 'it' && pIT) pIT.setAttribute('fill', D.it.c);
        if (T.at !== 'loose') plug.setAttribute('opacity', 0);
      }
    };
    st.s2.raf = requestAnimationFrame(frame);
  }

  /* ---------- 3: half-empty switches ---------- */
  function s3(mode){
    const c = st.s3, order = ['it','ks','kd','gs'];
    const rows = [];
    if (!mode){
      order.forEach(k => {
        const n = c[k], cnt = Math.max(1, Math.ceil(n / 24));
        for (let s = 0; s < cnt; s++){
          const used = Math.min(24, n - s * 24);
          rows.push({ k, label:`switch: ${D[k].n}${cnt > 1 ? ' #' + (s + 1) : ''}`, ports: Array.from({length:24}, (_, i) => i < used ? D[k].c : null), used });
        }
      });
    } else {
      const all = []; order.forEach(k => { for (let i = 0; i < c[k]; i++) all.push(D[k].c); });
      const cnt = Math.max(1, Math.ceil(all.length / 24));
      for (let s = 0; s < cnt; s++){
        const part = all.slice(s * 24, s * 24 + 24);
        rows.push({ label:`switch wspólny #${s + 1} (VLAN 10/20/30/40)`, ports: Array.from({length:24}, (_, i) => part[i] || null), used: part.length });
      }
    }
    let g = '', hitRow = -1, hitIdx = -1;
    if (c.last){
      if (!mode){ rows.forEach((r, i) => { if (r.k === c.last){ hitRow = i; hitIdx = r.used - 1; } }); }
      else { let n = -1; for (const k of order){ n += c[k]; if (k === c.last) break; } hitRow = Math.floor(n / 24); hitIdx = n % 24; }
    }
    rows.forEach((r, i) => {
      const s = sw(30, 20 + i * 62, r.ports, 12, '', { pw:16, ph:12, gap:5 });
      if (i === hitRow && hitIdx >= 0){ const pt = s.port(hitIdx); var ring = `<circle cx="${pt.x}" cy="${pt.y}" r="6" class="pingS"/>`; }

      if (mode) r.ports.forEach((col, pi) => { if (col && hi.some(k => D[k].c === col)){ const pt = s.port(pi); hl += `<rect x="${pt.x - 10}" y="${pt.y - 8}" width="20" height="16" rx="3" class="hl" style="stroke-width:2"/>`; } });
      g += s.svg + hl + (i === hitRow && hitIdx >= 0 ? ring : '') + `<text x="${30 + s.w + 14}" y="${20 + i * 62 + 18}" class="lbl">${r.label}</text>
        <text x="${30 + s.w + 14}" y="${20 + i * 62 + 35}" class="lbls">zajęte ${r.used}/24 · wolne ${24 - r.used}</text>`;
    });
    return { svg: svgWrap(590, Math.max(340, 30 + rows.length * 62), g), rows };
  }

  function s3guide(mode){

  /* ---------- scenario definitions ---------- */
  const SC = [

        : [metric('kabli przechodzących przez piętra', '7', 'bad'), metric('nowy komputer księgowości na 3. piętrze', 'nowy kabel przez cały budynek', 'bad')],
      explain: m => m
        ? '<b>Z VLAN-ami</b> na każdym piętrze stoi jeden switch, a komputer wpina się do najbliższego. Kolor portu, czyli VLAN, decyduje o tym, do jakiego „pokoju” trafia. Piętra łączy po jednym kablu, <b>trunku</b>, który przenosi ruch wszystkich VLAN-ów naraz. Każda ramka ma naklejkę z numerem VLAN-u (paski na kablu).'
        : '<b>Przed VLAN-ami</b> przynależność do sieci wyznaczał <b>kabel</b>, czyli to, do którego switcha był wpięty komputer. Księgowość na 3. piętrze oznacza osobny kabel w dół do switcha księgowości. Pion kablowy szybko się zapycha, a każdy nowy komputer to kucie i ciągnięcie przewodu.' },
    { tab:'2. Zmiana działu',
      title:'Kłopot 2: pracownik zmienia dział',
      problem:'Anna przechodzi z IT do księgowości, ale zostaje przy tym samym biurku. Jej komputer musi trafić do innej sieci.',
      render: s2, legend:['it','ks'],
      actions: m => {
        const n = S2STEPS[m].length, k = st.s2.step, end = k >= n;
        const runTxt = st.s2.playing ? '⏸ Pauza' : (k === 0 ? '▶ Przenieś Annę do księgowości' : '▶ Odtwarzaj dalej');
        return `<button class="primary" id="a2run" ${end ? 'disabled' : ''}>${runTxt}</button>
          <button id="a2prev" ${k === 0 ? 'disabled' : ''} title="Strzałka w lewo">◀ Krok wstecz</button>
          <button id="a2next" ${end ? 'disabled' : ''} title="Strzałka w prawo">Krok dalej ▶</button>
          <span class="stepinfo">Krok <b>${k}</b> / ${n}</span>
          <button id="a2reset">↺ Od nowa</button>
          <span class="hint">Strzałki ← → na klawiaturze też działają.</span>`;
      },
      metrics: m => {
        const done = st.s2.step >= S2STEPS[m].length;
        return m
          ? [metric('czas', done ? '≈ 3 min' : '…', 'good'), metric('kto musi iść do szafy', 'nikt', 'good'), metric('przepiętych kabli', '0', 'good')]
          : [metric('czas', done ? '≈ 1 godz.' : '…', 'bad'), metric('kto musi iść do szafy', 'technik', 'bad'), metric('przepiętych kabli', '1', 'bad')];
      },
      explain: m => m
        ? '<b>Z VLAN-ami</b> przynależność do sieci to <b>ustawienie portu</b> w konfiguracji switcha, a nie kabel. Zmiana działu to jedna komenda, wpisana zdalnie. Kable w szafie zostają w spokoju.'
        : '<b>Przed VLAN-ami</b> zmiana sieci oznacza <b>fizyczne przepięcie kabla</b>. Trzeba iść do szafy, znaleźć właściwy przewód i liczyć, że w docelowym switchu jest wolny port. W dużej firmie takie zgłoszenia są codziennie.' },
    { tab:'3. Pół-puste switche',
      title:'Kłopot 3: każdy dział ma własny, pół-pusty switch',
      problem:'Jesteś na praktykach u Oli, adminki sieci. Ciemny przycisk to Twoja odpowiedź w rozmowie. Klikaj, żeby iść dalej.',
      render: s3story, legend:['it','ks','kd','gs'], noExplain:true,
      metrics: m => {
        const r = s3(m).rows, used = r.reduce((a, x) => a + x.used, 0), all = r.length * 24;
        return [metric((r.length === 1 ? 'switch' : r.length < 5 ? 'switche' : 'switchy') + ' do kupienia, zasilania i skonfigurowania', r.length, m ? 'good' : 'bad'),
                metric('zajęte porty', `${used} / ${all}`), metric('wykorzystanie portów', Math.round(used / all * 100) + '%', m ? 'good' : 'bad')];
      },
      explain: m => m
        ? '<b>Z VLAN-ami</b> jeden switch obsługuje wszystkie działy naraz, a każdy port ma przypisany VLAN. Kolejny switch kupujesz dopiero wtedy, gdy <b>naprawdę</b> zabraknie portów, a nie dlatego, że pojawił się nowy dział.'
        : '<b>Przed VLAN-ami</b> granicę sieci wyznaczał fizyczny switch. Mały dział i tak potrzebuje całego urządzenia. Spróbuj dodać 18 osób do IT: dział dostanie drugi switch, choć u innych porty stoją wolne.' },
    { tab:'4. Płaska sieć',
      title:'Kłopot 4: jedna płaska sieć, czyli krzyk do wszystkich i zero separacji',
      problem:'Alternatywa dla wielu switchy to wpięcie wszystkich do jednej wielkiej sieci. Tanio, ale każdy słyszy każdego.',
      render: s4, legend:['it','ks','kd','gs'],
      actions: () => `<button class="primary" id="a4b">📢 Bartek wysyła broadcast ARP</button><button id="a4i">${st.s4.intruder ? '✖ Odłącz' : '🕵 Wepnij'} obcy laptop</button><button id="a4reset">↺ Wyczyść</button>`,
      metrics: m => [
        metric('odebrało broadcast Bartka', st.s4.bcast ? (m ? '3 urządzenia' : '15 urządzeń') : '–', st.s4.bcast ? (m ? 'good' : 'bad') : ''),
        metric('obcy laptop widzi', st.s4.intruder ? (m ? '4 urządzenia gości' : 'wszystkie 16, z serwerem kadr') : '–', st.s4.intruder ? (m ? 'good' : 'bad') : '')],
      explain: m => m
        ? '<b>Z VLAN-ami</b> broadcast zostaje w swoim VLAN-ie: krzyk Bartka słyszą tylko 3 osoby z IT. Gniazdko na korytarzu jest przypisane do VLAN-u gości, więc obcy laptop nie widzi serwera kadr. Ruch między VLAN-ami musi przejść przez router lub firewall, a tam stawiamy reguły dostępu.'
        : '<b>Przed VLAN-ami, w płaskiej sieci</b>, każdy broadcast (ARP, DHCP i inne) trafia do <b>wszystkich</b>. Przy setkach urządzeń to ciągły szum. Do tego każdy, kto wepnie laptopa do dowolnego gniazdka, jest „w środku” i widzi wszystko, także serwer kadr.' }
  ];

  /* ---------- UI ---------- */
  const $ = id => document.getElementById(id);
  $('tabs').innerHTML = SC.map((s, i) => `<button class="tab" data-t="${i}">${s.tab}</button>`).join('');
  $('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; go(+b.dataset.t); };
  $('seg').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; setMode(+b.dataset.m); };
  const eraToggle = () => { const on = !st.mode.every(m => m === 1); st.mode = st.mode.map(() => on ? 1 : 0); resetAnims(); render(); };
  $('era').onclick = eraToggle;
  $('era').onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); eraToggle(); } };

  function resetAnims(){ clearTimeout(st.s2.timer); st.s2.playing = false; cancelAnimationFrame(st.s2.raf); st.s2.step = 0; st.s2.prev = null; }
  function setMode(m){ st.mode[st.tab] = m; resetAnims(); render(); }
  function go(t){ st.tab = t; resetAnims(); try { history.replaceState(null, '', '#problem-' + (t + 1)); } catch(e){ location.hash = 'problem-' + (t + 1); } render(); }

  function stopS2(){ clearTimeout(st.s2.timer); st.s2.playing = false; }
  function runS2(){
    if (st.s2.playing){ stopS2(); render(); return; }          // pause
    const m = st.mode[1], steps = S2STEPS[m];
    if (st.s2.step >= steps.length) return;
    st.s2.playing = true;
    const tick = () => {
      st.s2.step++;
      if (st.s2.step >= steps.length) st.s2.playing = false;
      render();
      if (st.s2.playing) st.s2.timer = setTimeout(tick, m ? 1400 : 1900);
    };
    tick();
  }
  function stepS2(d){
    stopS2();
    const n = S2STEPS[st.mode[1]].length, k = Math.max(0, Math.min(n, st.s2.step + d));
    if (k === st.s2.step){ render(); return; }
    st.s2.step = k; render();
  }

  function render(){
    const s = SC[st.tab], m = st.mode[st.tab];
    document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('on', i === st.tab));
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', +b.dataset.m === m));
    const allOn = st.mode.every(x => x === 1);
    $('era').classList.toggle('on', allOn); $('era').setAttribute('aria-checked', allOn);
    $('eraTxt').textContent = allOn ? 'Era VLAN-ów: włączona' : 'Era VLAN-ów: wyłączona';
    $('title').textContent = s.title;
    $('problem').textContent = s.problem;
    $('stage').innerHTML = s.render(m);
    $('legend').innerHTML = legendDepts(s.legend) + (st.tab === 0 && m ? `<span><i style="background:repeating-linear-gradient(90deg,${D.it.c} 0 6px,${D.ks.c} 6px 12px)"></i>trunk: wiele VLAN-ów w jednym kablu</span>` : '');
    const gd = s.guide ? s.guide(m) : null;
    $('guide').innerHTML = gd ? gd.html : ''; $('guide').style.display = gd ? 'flex' : 'none';
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('next', !!gd && gd.hot === 'seg' + b.dataset.m));
    $('actions').innerHTML = s.actions ? s.actions(m) : '';
    $('actions').style.display = s.actions ? 'flex' : 'none';
    $('metrics').innerHTML = s.metrics(m).join('');
    $('explain').innerHTML = s.explain(m);
    $('explain').className = 'explain' + (m ? ' after' : '');
    $('explain').style.display = s.noExplain ? 'none' : '';
    // log for scenario 2
    if (st.tab === 1){
      const steps = S2STEPS[m];
      $('log').innerHTML = steps.slice(0, st.s2.step).map(x => `<li><span class="t">${x.t}</span>${x.h}</li>`).join('');
    } else $('log').innerHTML = '';
    bind();
    if (st.tab === 1) animS2();
  }

  function bind(){
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    on('a2run', runS2);
    on('a2reset', () => { resetAnims(); render(); });
    on('d3prev', () => step3(-1));
    on('d3next', () => step3(1));
    on('a2prev', () => stepS2(-1));
    on('a2next', () => stepS2(1));
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const k = b.dataset.add; st.s3[k] += +(b.dataset.n || 1); st.s3.last = k; st.s3.touched = true; render(); });
    on('a3reset', () => { st.s3 = { it:7, ks:5, kd:4, gs:6 }; render(); });
    on('a4b', () => { st.s4.bcast = 0; render(); requestAnimationFrame(() => { st.s4.bcast = Date.now(); render(); }); });
    on('a4i', () => { st.s4.intruder = !st.s4.intruder; render(); });
    on('a4reset', () => { st.s4 = { bcast:0, intruder:false }; render(); });
  }

  addEventListener('keydown', e => {
    if ((st.tab !== 1 && st.tab !== 2) || e.altKey || e.ctrlKey || e.metaKey) return;
    const stepFn = st.tab === 1 ? stepS2 : step3;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); stepFn(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); stepFn(-1); }
  });

  const h = (location.hash.match(/^#problem-([1-4])$/) || [])[1];
  st.tab = h ? +h - 1 : 0;
  addEventListener('hashchange', () => { const x = (location.hash.match(/^#problem-([1-4])$/) || [])[1]; if (x && +x - 1 !== st.tab){ st.tab = +x - 1; resetAnims(); render(); } });
  render();
})();
</script>
</body>
</html>
